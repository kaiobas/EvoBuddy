# ─── Docker Compose para produção (KVM8) ─────────────────────
# Uso: docker compose up -d

services:
  # API backend (Express)
  api:
    build:
      context: .
      target: api
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
        - VITE_API_URL=${VITE_API_URL}
    container_name: evobuddy-api
    restart: unless-stopped
    networks:
      - default
      - easypanel
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - PORT=3001
      - NODE_ENV=production
      - CORS_ORIGIN=${CORS_ORIGIN:-https://bitsautomacoes.site}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-bitsautomacoes.site}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Frontend SPA (nginx)
  web:
    build:
      context: .
      target: web
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
        - VITE_API_URL=${VITE_API_URL}
    container_name: evobuddy-web
    restart: unless-stopped
    networks:
      - default
      - easypanel
    depends_on:
      - api

networks:
  easypanel:
    external: true
